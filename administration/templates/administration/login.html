{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration Login</title>
    <link rel="stylesheet" href="{% static 'administration/css/login.css' %}">
    <link rel="stylesheet" href="{% static 'home/css/password_toggle.css' %}">
    <script defer src="{% static 'home/js/password_toggle.js' %}"></script>
</head>
<body>
    <main class="login-container">
        <div class="login-box">
            <div class="admin-icon">A</div>
            <h1>Administration Login</h1>
            <p>Sign in with your administrator account.</p>

            {% if messages %}
                {% for message in messages %}
                    <p class="message">{{ message }}</p>
                {% endfor %}
            {% endif %}

            {% if error %}
                <p class="message">{{ error }}</p>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="input-group">
                    <label for="username">Admin username</label>
                    <input id="username" type="text" name="username" autocomplete="username" required autofocus>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password" autocomplete="current-password" required>
                </div>

                <button type="submit">Sign in</button>
            </form>

            <p class="back-home">
                <a href="{% url 'home' %}">Back to home</a>
            </p>
            <p class="back-home">
                <a href="{% url 'login' %}">Employee login</a>
            </p>
        </div>
    </main>
</body>
</html>
